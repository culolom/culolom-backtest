name: Update Weekly MACD Backtests

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions 使用 UTC。
    # 10:30 UTC = 台灣時間 18:30。
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

jobs:
  update-backtests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      # 保留你原本的資料更新步驟。
      # 若目前 workflow 已經會更新 data/^TWII.csv 與 data/00631L.TW.csv，
      # 請把那一段放在這裡，不要重複新增。
      #
      # 範例：
      # - name: Update market data
      #   run: python scripts/update_market_data.py

      - name: Run original weekly MACD backtest
        run: python scripts/weekly_macd_backtest.py

      - name: Run fixed-weight leveraged ETF rebalance backtest
        run: python scripts/weekly_macd_fixed_rebalance.py

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "Update weekly MACD backtest outputs"
          git push
