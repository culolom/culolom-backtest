name: Update TAIEX SMA Drawdown Analysis

on:
  workflow_dispatch:

  # 每天台灣時間上午 6:30 執行
  # GitHub Actions 使用 UTC，因此為前一天 22:30 UTC
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: write

concurrency:
  group: update-twii-sma-drawdown
  cancel-in-progress: false

jobs:
  update-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Generate SMA drawdown analysis
        run: |
          python scripts/analyze_twii_sma_drawdown.py

      - name: Commit updated analysis files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             output/twii_sma_drawdown.json             output/twii_sma_events.csv             output/national_stabilization_fund_analysis.csv

          if git diff --cached --quiet; then
            echo "No SMA drawdown analysis changes."
          else
            git commit -m "Daily auto-update TAIEX SMA drawdown analysis"
            git push
          fi
